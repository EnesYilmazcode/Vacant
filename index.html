<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Vacant &middot; Ohio State</title>
<meta name="description" content="Find an empty classroom near you at Ohio State, free for as long as you need it.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<style>
  :root {
    --bg: #0b0d10;
    --fg: #eef1f5;
    --dim: #8b94a2;
    --line: #1d232c;
    --card: #121821;
    --accent: #ff4d3d;
    --you: #4cc2ff;
    --warn: #ffb02e;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg); overflow: hidden;
    font: 16px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* The map is the surface of the app, not a panel inside it. */
  #map {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    filter: blur(7px) saturate(.85); transform: scale(1.06);
    transition: filter .9s ease, transform .9s ease;
  }
  #map.settled { filter: none; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    #map { transition: none; }
  }

  /* --- the question --- */
  #ask {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.6rem; padding: 1.5rem;
    background: radial-gradient(120% 80% at 50% 45%, rgba(11,13,16,.45), rgba(11,13,16,.88));
  }
  #ask h1 {
    margin: 0; font-size: clamp(2.4rem, 13vw, 3.4rem); font-weight: 800;
    letter-spacing: -.04em; line-height: 1;
  }
  #ask h1 span { color: var(--accent); }
  #ask .q { margin: 0; font-size: 1.18rem; color: var(--fg); font-weight: 600; }
  #ask .sub { margin: -1.1rem 0 0; color: var(--dim); font-size: .88rem; text-align: center; }
  .opts { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  .opt {
    appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--fg);
    font: inherit; font-weight: 650; padding: .95rem 1.35rem; border-radius: 999px;
    min-height: 52px; min-width: 88px; cursor: pointer;
  }
  .opt.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .opt:active { transform: scale(.97); }
  .until { display: flex; align-items: center; gap: .5rem; color: var(--dim); font-size: .9rem; }
  .until input {
    appearance: none; background: var(--card); border: 1px solid var(--line); color: var(--fg);
    font: inherit; padding: .6rem .8rem; border-radius: 10px; min-height: 44px;
  }
  #ask:not(.ready) .opts, #ask:not(.ready) .until { opacity: .45; pointer-events: none; }
  #ask:not(.ready) .loading { opacity: 1; }
  .loading { color: var(--dim); font-size: .82rem; opacity: 0; transition: opacity .3s; }

  /* --- the answer --- */
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: 62%;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(11,13,16,.82), var(--bg) 22%);
    border-top: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding-bottom: var(--safe-b);
  }
  #sheet header {
    display: flex; align-items: center; gap: .75rem;
    padding: .85rem 1.1rem .7rem; border-bottom: 1px solid var(--line);
  }
  #sheet header .grip {
    position: absolute; top: .4rem; left: 50%; transform: translateX(-50%);
    width: 34px; height: 4px; border-radius: 2px; background: var(--line);
  }
  #sheet h2 { margin: 0; font-size: .95rem; font-weight: 700; flex: 1; }
  #sheet h2 b { color: var(--accent); }
  #again {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--dim);
    font: inherit; font-size: .82rem; padding: .5rem .8rem; border-radius: 999px;
    min-height: 44px; cursor: pointer;
  }
  #list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: .3rem 0 1rem; }
  .row {
    appearance: none; width: 100%; text-align: left; background: transparent; color: inherit;
    font: inherit; border: 0; border-left: 3px solid transparent;
    padding: .72rem 1.1rem; min-height: 56px; cursor: pointer; display: block;
  }
  .row.on { border-left-color: var(--accent); background: rgba(255,77,61,.07); }
  .row .name { display: block; font-weight: 700; letter-spacing: -.01em; }
  .row .name em { font-style: normal; color: var(--dim); font-weight: 500; margin-left: .5rem; font-size: .88rem; }
  .row .meta { display: block; color: var(--dim); font-size: .84rem; margin-top: .1rem; }
  .row .meta b { color: var(--fg); font-weight: 650; }
  .warn { color: var(--warn); }
  .empty { color: var(--dim); padding: 1.4rem 1.1rem; margin: 0; }

  #note {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + .7rem); left: 50%;
    transform: translateX(-50%); max-width: 92vw;
    background: var(--card); border: 1px solid var(--line); color: var(--dim);
    font-size: .8rem; padding: .5rem .85rem; border-radius: 999px; text-align: center;
  }
  #term {
    position: fixed; bottom: calc(var(--safe-b) + .5rem); right: .8rem;
    color: var(--dim); font-size: .72rem; opacity: .55;
  }
  #sheet:not([hidden]) ~ #term { display: none; }
</style>
</head>
<body>

<canvas id="map"></canvas>
<p id="note" hidden></p>

<section id="ask">
  <h1>Vacant<span>.</span></h1>
  <p class="q">How long do you need?</p>
  <p class="sub">A room near you, open, and free for that long once you get there.</p>
  <div class="opts">
    <button class="opt primary" data-min="30">30 min</button>
    <button class="opt" data-min="60">1 hour</button>
    <button class="opt" data-min="120">2 hours</button>
  </div>
  <label class="until">until <input id="until" type="time" aria-label="I need a room until"></label>
  <p class="loading">finding campus&hellip;</p>
</section>

<section id="sheet" hidden>
  <header>
    <span class="grip"></span>
    <h2 id="head">Free for <b id="need">30 min</b>, nearest first</h2>
    <button id="again">change</button>
  </header>
  <div id="list"></div>
</section>

<p id="term"></p>

<script type="module" src="js/app.js"></script>
<noscript>
  <p style="padding:2rem;color:#8b94a2">Vacant needs JavaScript to rank rooms. The data it uses is at
  <a href="https://github.com/EnesYilmazcode/Vacant" style="color:#eef1f5">github.com/EnesYilmazcode/Vacant</a>.</p>
</noscript>
</body>
</html>
