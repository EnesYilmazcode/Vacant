<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>launch spike, Vacant #29</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #fff; color: #000;
    padding: max(10px, env(safe-area-inset-top)) 12px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  h1 a { color: #444; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  button {
    font: inherit; min-height: 44px; border: 2px solid #000; background: #fff;
    color: #000; border-radius: 8px; padding: 8px 12px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  #go { font-size: 19px; font-weight: 700; min-height: 60px; background: #000; color: #fff; }
  select { font: inherit; min-height: 44px; border: 2px solid #000; border-radius: 8px; padding: 0 8px; background: #fff; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .bar > * { flex: 1; }
  .bar button { font-size: 14px; padding: 6px 8px; }
  .card { border: 2px solid #000; border-radius: 8px; padding: 8px 10px; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .big div { border-right: 1px solid #ccc; }
  .big div:last-child { border-right: 0; }
  .big b { display: block; font-size: 30px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .big span { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: .03em; }
  .grid { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font-size: 13px; }
  .grid b { font-variant-numeric: tabular-nums; text-align: right; }
  .warn { color: #a11111; font-weight: 600; }
  .ok { color: #06621f; font-weight: 600; }
  .note { font-size: 12px; color: #555; margin: 4px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
  th, td { border-bottom: 1px solid #ddd; padding: 3px 4px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .sheet { position: fixed; inset: 0; background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 2; }
  .sheet[hidden] { display: none; }
  textarea { flex: 1; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border: 2px solid #000; border-radius: 8px; padding: 8px; width: 100%; }
  @media (prefers-reduced-motion: no-preference) { #go:active { transform: scale(.98); } }
</style>
</head>
<body>

<h1>launch spike <a href="https://github.com/EnesYilmazcode/Vacant/issues/29">#29</a></h1>

<div class="card" id="facts">Loading nothing yet. Press the button.</div>

<button id="go" aria-label="Fetch, parse and answer once, and time each step">Run once</button>

<div class="bar">
  <select id="state" aria-label="Which launch state this run is">
    <option value="warm">warm, from the app switcher</option>
    <option value="cold process">cold process, force quit then relaunch</option>
    <option value="cold everything">cold everything, first launch after install</option>
  </select>
  <button id="record" disabled>Record run</button>
</div>

<div class="bar">
  <button id="baseline" disabled>Save as desktop baseline</button>
  <button id="report">Report <span id="n">(0)</span></button>
</div>

<div class="card" id="map"></div>
<div class="card" id="ratio"></div>
<div id="runs"></div>

<section class="sheet" id="sheet" hidden aria-label="Markdown report">
  <textarea id="md" readonly spellcheck="false"></textarea>
  <div class="bar">
    <button id="copy">Copy</button>
    <button id="wipe">Erase runs</button>
    <button id="close">Close</button>
  </div>
</section>

<script type="module">
import { rank } from './engine.vendor.js';
import { pickHoursTerm, makeHoursFor } from './hours.vendor.js';
import { termGate, fmtDay, isoDate } from './term.vendor.js';
import { verdict, median, STATES, COLD_STATES } from './verdict.js';
import { allocation, backing, blit } from './raster.js';

const $ = (id) => document.getElementById(id);
const RUNS_KEY = 'vacant.spike.launch.runs.v1';
const BASE_KEY = 'vacant.spike.launch.baseline.v1';

// current.json is fetched first and alone, because that is what js/app.js
// boot() does: it awaits the pointer before it can ask for the index, since the
// pointer is the file that names the index. The other three are named by it or
// fixed, and are fetched together the way boot() fetches them.
const CURRENT = '../data/current.json';
const HOURS = '../data/buildings-hours.json';
// The map's own file. It is fetched in the basemap step below, not here, so a
// device that cannot build a raster still reports every timing number.
const CAMPUS = '../data/campus.json';
const up = (p) => '../' + p;

// A single parse on a phone is noise, so each run parses the same string this
// many times and reports the median. The first parse is kept separately,
// because it is the only one that pays the cold JIT the app actually pays.
const PARSES = 7;

// The Oval, the app's own fallback origin. The first answer has to start
// somewhere and geolocation is not part of what #29 is timing.
const OVAL = { lat: 39.9995, lon: -83.013 };
const NEEDED = 30;

// Local, never UTC. These get pasted into a log of when somebody was standing
// somewhere, and a stamp four hours off is worse than no stamp.
const pad2 = (n) => String(n).padStart(2, '0');
const localDate = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const shown = (iso) => { const d = new Date(iso); return localDate(d) + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const shownTime = (iso) => { const d = new Date(iso); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };

const round = (n) => Math.round(n * 10) / 10;
const kb = (b) => (b == null ? '-' : (b / 1024).toFixed(1) + ' KB');
const load = (k, fallback) => { try { const v = localStorage.getItem(k); return v == null ? fallback : JSON.parse(v); } catch { return fallback; } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode, the run still reports */ } };

let runs = load(RUNS_KEY, []);
let baseline = load(BASE_KEY, null);
let last = null;

// Only the first run in a page context pays the cold JIT that #29 is asking
// about. Run the button twice without reloading and the second parse is warm,
// which is a smaller number describing a launch that never happens.
let contextRuns = 0;

function device() {
  const c = navigator.connection;
  return {
    ua: navigator.userAgent,
    cores: navigator.hardwareConcurrency ?? null,
    memoryGB: navigator.deviceMemory ?? null,
    dpr: window.devicePixelRatio ?? null,
    screen: screen.width + 'x' + screen.height,
    standalone: ('standalone' in navigator ? navigator.standalone === true : null),
    displayMode: window.matchMedia ? window.matchMedia('(display-mode: standalone)').matches : null,
    connection: c ? (c.effectiveType || '?') + (c.downlink ? ', ' + c.downlink + ' Mbit/s down' : '') : null,
  };
}

// What the browser really moved over the wire. transferSize 0 with a real body
// means the HTTP cache served it, which makes the network figure meaningless
// and has to be said rather than averaged in.
function transfer(url) {
  const abs = new URL(url, location.href).href;
  const e = performance.getEntriesByType('resource').filter((r) => r.name === abs).pop();
  if (!e) return null;
  return {
    transferSize: e.transferSize,
    encoded: e.encodedBodySize,
    decoded: e.decodedBodySize,
    fromCache: e.transferSize === 0 && e.decodedBodySize > 0,
    compressed: e.encodedBodySize > 0 && e.encodedBodySize < e.decodedBodySize,
  };
}

// How many times the raster is drawn into a screen-sized canvas. Six, because
// the first is the one being isolated and five is enough for a median that one
// slow frame cannot move.
const BLITS = 6;

// The patch pulled off each canvas in the readback race. 512 square is big
// enough that the cost is the transfer and not the call.
const PATCH = 512;

// The map half of #29's revision comment: does the canvas allocation succeed,
// is it GPU backed, what does the first blit cost against the later ones, how
// big is the raster, and how long does buildBasemap take.
//
// This is the one place on the page that loads app code. Everything else here
// runs off a vendored copy so a broken js/ cannot break the instrument, and
// that rule is right for the ranking. It is wrong here: buildBasemap's wall
// clock IS the measurement, and a copy that had quietly drifted would report a
// confident number for code the app does not run. So it is a dynamic import
// inside a try, taken last, after every timing number above is already
// recorded. A missing or broken js/map.js costs this panel and nothing else.
async function basemap() {
  try {
    const { buildBasemap, pixelsPerGridFor } = await import('../js/map.js');

    const c0 = performance.now();
    const campus = await fetch(CAMPUS, { cache: 'default' }).then((r) => r.json());
    const campusMs = performance.now() - c0;

    // The same two lines js/app.js boot() runs before it calls buildBasemap.
    const shorter = Math.min(window.innerWidth, window.innerHeight) || 390;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const b0 = performance.now();
    const bm = buildBasemap(campus, pixelsPerGridFor(campus, shorter, dpr));
    const buildMs = performance.now() - b0;
    // Canvas work is queued, not done, so the call above can return before the
    // raster exists. One pixel read back forces it to exist, and that wait is
    // reported apart rather than folded in, because the split is the difference
    // between "buildBasemap is cheap" and "buildBasemap defers everything".
    const f0 = performance.now();
    const g = bm.canvas.getContext('2d');
    g.getImageData(0, 0, 1, 1);
    const flushMs = performance.now() - f0;

    // Distinct colours in a 48 square downsample. A basemap that drew has
    // hundreds; one the device silently refused to paint has one.
    const probe = document.createElement('canvas');
    probe.width = 48;
    probe.height = 48;
    const pg = probe.getContext('2d', { willReadFrequently: true });
    pg.drawImage(bm.canvas, 0, 0, 48, 48);
    const px = pg.getImageData(0, 0, 48, 48).data;
    const seen = new Set();
    for (let i = 0; i < px.length; i += 4) seen.add((px[i] << 16) | (px[i + 1] << 8) | px[i + 2]);

    // Blits into a screen-sized canvas. The one pixel read after each draw is a
    // fence: without it drawImage returns before the GPU has done anything and
    // every number is a lie. It is the same fence on every blit, so it cancels
    // out of the first-against-the-rest gap, which is what is being asked for.
    const vw = Math.max(1, Math.round((window.innerWidth || 390) * dpr));
    const vh = Math.max(1, Math.round((window.innerHeight || 780) * dpr));
    const screenCanvas = document.createElement('canvas');
    screenCanvas.width = vw;
    screenCanvas.height = vh;
    const sg = screenCanvas.getContext('2d');
    const blits = [];
    for (let i = 0; i < BLITS; i++) {
      const t = performance.now();
      sg.drawImage(bm.canvas, 0, 0, bm.width, bm.height, 0, 0, vw, vh);
      sg.getImageData(0, 0, 1, 1);
      blits.push(performance.now() - t);
    }

    // The readback race. Same patch, same pixel count, two canvases: the real
    // raster, and one asked for with willReadFrequently, which is CPU backed by
    // definition. Two timed reads each and the first of each thrown away, kept
    // short on purpose: a browser that sees repeated readbacks on a canvas will
    // move it off the GPU, and enough reads here would erase the difference
    // this is trying to see.
    const cpu = document.createElement('canvas');
    cpu.width = PATCH;
    cpu.height = PATCH;
    const cg = cpu.getContext('2d', { willReadFrequently: true });
    cg.drawImage(bm.canvas, 0, 0, PATCH, PATCH, 0, 0, PATCH, PATCH);
    const read = (ctx) => {
      const t = performance.now();
      ctx.getImageData(0, 0, PATCH, PATCH);
      return performance.now() - t;
    };
    read(g);
    read(cg);
    const plainMs = Math.min(read(g), read(g));
    const cpuMs = Math.min(read(cg), read(cg));

    return {
      ok: true,
      campusMs,
      buildMs,
      flushMs,
      alloc: allocation({
        wantedWidth: bm.width,
        wantedHeight: bm.height,
        gotWidth: bm.canvas.width,
        gotHeight: bm.canvas.height,
        colours: seen.size,
      }),
      blit: blit(blits),
      blits: blits.map(round),
      backing: backing({ plainMs, cpuMs, renderer: rendererName() }),
      viewport: vw + 'x' + vh,
    };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

// What the device says its GPU is. A different question from whether this 2D
// canvas got one, and printed as a different sentence for that reason.
function rendererName() {
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    if (!gl) return null;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
  } catch {
    return null;
  }
}

async function once() {
  performance.clearResourceTimings();
  contextRuns++;
  const t0 = performance.now();

  const timed = async (url, as) => {
    const s = performance.now();
    const r = await fetch(url, { cache: 'default' });
    const body = as === 'text' ? await r.text() : await r.json();
    return { body, ms: performance.now() - s };
  };

  // The pointer, alone and first, because js/app.js boot() cannot ask for the
  // index until it arrives: current.json is the file that names the index. This
  // page used to fetch all four together and call that "the way js/app.js
  // fetches them", which it never was. On this laptop the wait reads like
  // nothing. On a phone's link it is a whole round trip in front of the biggest
  // file the first answer needs, and that is the number worth carrying home.
  const cur = await timed(CURRENT, 'json');
  const pointerMs = performance.now() - t0;
  const INDEX = up(cur.body.rooms);

  // Then the three the pointer unblocked, together, the way boot() does.
  const [idxRaw, bld, hrs] = await Promise.all([
    timed(INDEX, 'text'),
    timed(up(cur.body.buildings), 'json'),
    timed(HOURS, 'json'),
  ]);
  const netWall = performance.now() - t0;

  const text = idxRaw.body;
  const parses = [];
  let index = null;
  for (let i = 0; i < PARSES; i++) {
    const s = performance.now();
    index = JSON.parse(text);
    parses.push(performance.now() - s);
  }

  const term = pickHoursTerm(hrs.body, cur.body);
  const hoursFor = makeHoursFor(term);
  const now = new Date();
  // Fetch and parse cost the same on any date, so they are still worth timing
  // out of term. The ANSWER is not: js/app.js returns from boot() before
  // state.ready when the term is over, so it ranks nothing and shows nothing.
  // The rank() below is then a cost measurement and not a list of free rooms,
  // and the page has to say which it is.
  const gate = termGate(cur.body, isoDate(now));
  const a0 = performance.now();
  const rows = rank(
    Object.entries(index.rooms).map(([id, r]) => ({ id, ...r })),
    {
      origin: OVAL,
      now: now.getHours() * 60 + now.getMinutes(),
      day: now.getDay(),
      needed: NEEDED,
      buildings: bld.body.buildings,
      hoursFor,
      sessions: index.sessions,
      date: localDate(now),
    },
  );
  const answerMs = performance.now() - a0;

  let tuples = 0;
  const roomIds = Object.keys(index.rooms);
  for (const id of roomIds) tuples += index.rooms[id].busy.length;

  const net = transfer(INDEX);
  const parseFirst = parses[0];
  const parseMedian = median(parses);
  // Last, so that a device that cannot build a raster has already produced
  // every number above.
  const raster = await basemap();

  return {
    at: new Date().toISOString(),
    // The state is stamped on at Record time, not here, so a run is not wasted
    // by forgetting to set the selector before pressing the button.
    state: null,
    firstInContext: contextRuns === 1,
    netIndex: idxRaw.ms,
    netWall,
    // How long boot() spends on the pointer before it can ask for the index.
    pointerMs,
    indexUrl: INDEX,
    // Which term's index this run measured. A run recorded before a rollover
    // timed a file the app no longer ships, and pooling it with the rest would
    // be comparing two different indexes.
    indexTerm: cur.body.term,
    netOthers: Math.max(bld.ms, hrs.ms, cur.ms),
    parses: parses.map(round),
    parseFirst,
    parseMedian,
    answerMs,
    // The number the decision turns on. Composed, not raw wall clock, because
    // the raw pass carries one noisy parse sample and this carries the median.
    total: idxRaw.ms + parseMedian + answerMs,
    // The same pass with the single cold parse the app really pays, printed
    // beside it so the choice of parse statistic is visible rather than buried.
    totalFirstParse: idxRaw.ms + parseFirst + answerMs,
    rooms: roomIds.length,
    buildingsInIndex: new Set(roomIds.map((id) => index.rooms[id].b)).size,
    tuples,
    sessions: index.sessions.length,
    answered: rows.length,
    gate: { open: gate.open, headline: gate.headline ?? null, from: gate.from, to: gate.to, term: gate.term },
    hoursTerm: term ? term.slug : null,
    bytes: net,
    raster,
    device: device(),
  };
}

function paintFacts(r) {
  if (!r) return;
  const n = r.bytes;
  const cacheLine = !n
    ? '<span class="warn">no Resource Timing entry</span>'
    : n.fromCache
      ? '<span class="warn">served from the HTTP cache, the network figure above is not a download</span>'
      : n.compressed
        ? '<span class="ok">' + kb(n.encoded) + ' over the wire, ' + kb(n.decoded) + ' decoded</span>'
        : '<span class="warn">' + kb(n.decoded) + ' uncompressed, this server sent no gzip</span>';

  // #29's acceptance box asks for an index of at least 900 rooms, on the
  // reasoning that a one-bucket sample understates the parse. That bar cannot
  // be met and never will be. The bucket sample is gone: this is a full harvest
  // of the term, and the build then deletes rooms on purpose, by type, in a
  // restricted building, off campus, too far from the Oval, too thinly booked,
  // or in a building whose hours nobody publishes. 425 ship. Waiting for 900 is
  // waiting for the filters to be wrong.
  //
  // So the bar the page checks is the one that can be checked: that the file
  // timed is the file the app ships, the one data/current.json names, and that
  // the report carries the counts a later index of another size can be scaled
  // against. Campus is about 1,067 rooms and that ratio stays on screen, as
  // arithmetic, clearly labelled, because it is the only honest way to say what
  // an unfiltered index would cost.
  const bar = '<span class="ok">' + r.rooms + ' rooms, parsed out of ' + r.indexUrl.replace('../', '') +
    ', which is the file data/current.json named when this run started, for term ' + r.indexTerm +
    '. That is what the app parses, so it is what #29 gets.</span>';
  const scale = '<span>All of campus is about 1,067 rooms against these ' + r.rooms +
    ', so an unfiltered index would parse roughly ' + (1067 / r.rooms).toFixed(2) +
    'x this. That is arithmetic on two room counts, not a measurement.</span>';

  $('facts').innerHTML =
    '<div class="big">' +
    '<div><b>' + round(r.netIndex) + '</b><span>network ms</span></div>' +
    '<div><b>' + round(r.parseMedian) + '</b><span>parse ms, median of ' + PARSES + '</span></div>' +
    '<div><b>' + round(r.total) + '</b><span>total ms</span></div>' +
    '</div>' +
    '<div class="grid" style="margin-top:8px">' +
    '<span>first parse, cold JIT</span><b>' + round(r.parseFirst) + ' ms</b>' +
    '<span>parse spread</span><b>' + round(Math.min(...r.parses)) + ' to ' + round(Math.max(...r.parses)) + ' ms</b>' +
    '<span>first answer, rank()</span><b>' + round(r.answerMs) + ' ms</b>' +
    '<span>total with the cold parse</span><b>' + round(r.totalFirstParse) + ' ms</b>' +
    '<span>pointer first, current.json</span><b>' + round(r.pointerMs) + ' ms before the index could be asked for</b>' +
    '<span>all four files, wall clock</span><b>' + round(r.netWall) + ' ms</b>' +
    '<span>rooms answered</span><b>' + (r.gate.open ? r.answered : 'none, the app refuses today') + '</b>' +
    '<span>index</span><b>' + r.rooms + ' rooms, ' + r.buildingsInIndex + ' buildings, ' + r.tuples.toLocaleString() + ' busy tuples, ' + r.sessions + ' sessions</b>' +
    '</div>' +
    '<p class="note">' + cacheLine + '</p>' +
    '<p class="note">' + bar + '</p>' +
    '<p class="note">' + scale + '</p>' +
    (r.gate.open
      ? ''
      : '<p class="note warn">' + r.gate.headline + '. The app answers only between ' +
        fmtDay(r.gate.from) + ' and ' + fmtDay(r.gate.to) + ', so it would have ranked nothing today. ' +
        'Network and parse above are still real costs. The ' + r.answered + ' rows rank() returned are a timing sample, not rooms this page is calling free.</p>') +
    (r.firstInContext
      ? ''
      : '<p class="note warn">This is run ' + contextRuns + ' in this window, so the JIT is already warm and the parse above is not a cold one. Reload before the next recorded run.</p>') +
    (r.device.connection ? '<p class="note">Connection: ' + r.device.connection + '. The network figure is about the link you are on, not about the file. #29 turns on the parse.</p>' : '');
}

function paintMap(r) {
  const m = r && r.raster;
  if (!m) { $('map').innerHTML = ''; return; }
  if (!m.ok) {
    $('map').innerHTML =
      '<h2>map raster</h2><p class="note warn">js/map.js did not load, so the four map questions in #29 are ' +
      'unanswered on this device. Everything above is unaffected. ' + m.error + '</p>';
    return;
  }
  $('map').innerHTML =
    '<h2>map raster</h2>' +
    '<div class="grid">' +
    '<span>campus.json, network</span><b>' + round(m.campusMs) + ' ms</b>' +
    '<span>buildBasemap, wall clock</span><b>' + round(m.buildMs) + ' ms</b>' +
    '<span>first readable pixel after it</span><b>' + round(m.flushMs) + ' ms</b>' +
    '<span>raster</span><b>' + m.alloc.megapixels.toFixed(2) + ' MP, ' + (m.alloc.bytes / 1048576).toFixed(1) + ' MB</b>' +
    '<span>blits into ' + m.viewport + '</span><b>' + m.blits.join(', ') + ' ms</b>' +
    '</div>' +
    '<p class="note ' + (m.alloc.ok ? 'ok' : 'warn') + '">' + m.alloc.line + '</p>' +
    '<p class="note">' + m.blit.line + '</p>' +
    '<p class="note">' + m.backing.line + '</p>' +
    // The fifth instrument the revision comment asks for, and the one that
    // should not be built. #94 replaced the unconditional loop with a
    // wake-driven one in js/map.js createFrameLoop. Driven headlessly on this
    // repo at 216ba00 through scripts/launch-desktop.mjs, with
    // requestAnimationFrame wrapped before any page script, a settled list
    // asked for 0 frames in a 3 second window at 1x, 4x and 6x CPU throttling,
    // five runs at each. There is nothing left on a phone for a frame counter
    // to find, and an instrument that can only ever print zero teaches a reader
    // that the panel is decoration.
    '<p class="note">No frame counter here on purpose. The loop that #29 wanted counted was fixed in #94, ' +
    'and a settled list asks for 0 frames in 3 seconds at 1x, 4x and 6x throttling, measured with ' +
    '<code>scripts/launch-desktop.mjs</code>. Nothing on a phone can make that number interesting.</p>';
}

function paintRatio() {
  if (!baseline) {
    $('ratio').innerHTML = '<p class="note">No desktop baseline saved. Open this page on the laptop, run it once, press <b>Save as desktop baseline</b>, then run it here. Until then the 4x to 8x multiplier in #29 stays a guess.</p>';
    return;
  }
  const here = last;
  const rows = [
    ['desktop baseline taken', shown(baseline.at)],
    ['desktop network / parse / total', round(baseline.netIndex) + ' / ' + round(baseline.parseMedian) + ' / ' + round(baseline.total) + ' ms'],
  ];
  if (here) {
    rows.push(['this device network / parse / total', round(here.netIndex) + ' / ' + round(here.parseMedian) + ' / ' + round(here.total) + ' ms']);
    rows.push(['parse ratio, this device over desktop', '<b>' + (here.parseMedian / baseline.parseMedian).toFixed(2) + 'x</b>']);
    rows.push(['total ratio', (here.total / baseline.total).toFixed(2) + 'x']);
  }
  $('ratio').innerHTML =
    '<h2>measured multiplier</h2>' +
    '<div class="grid">' + rows.map(([k, v]) => '<span>' + k + '</span><b>' + v + '</b>').join('') + '</div>' +
    (here && here.device.ua === baseline.device.ua
      ? '<p class="note warn">The baseline was taken on this same user agent, so this ratio compares a device with itself.</p>'
      : '');
}

function paintRuns() {
  $('n').textContent = '(' + runs.length + ')';
  if (!runs.length) { $('runs').innerHTML = ''; return; }
  const head = '<tr><th>state</th><th>ptr</th><th>net</th><th>parse</th><th>answer</th><th>total</th><th>JIT</th><th>cache</th></tr>';
  const body = runs.map((r, i) =>
    '<tr><td>' + r.state + ' ' + (runs.slice(0, i + 1).filter((x) => x.state === r.state).length) + '</td>' +
    '<td>' + (r.pointerMs == null ? '-' : round(r.pointerMs)) + '</td>' +
    '<td>' + round(r.netIndex) + '</td><td>' + round(r.parseMedian) + '</td>' +
    '<td>' + round(r.answerMs) + '</td><td>' + round(r.total) + '</td>' +
    '<td>' + (r.firstInContext ? 'cold' : 'warm') + '</td>' +
    '<td>' + (r.bytes && r.bytes.fromCache ? 'hit' : 'miss') + '</td></tr>').join('');
  $('runs').innerHTML = '<h2>recorded runs, ms</h2><table>' + head + body + '</table>' +
    '<p class="note">One recorded run per launch. A second run in the same window has a warm JIT and is marked so. ' +
    '<b>ptr</b> is the wait on current.json before the index could be asked for. A dash is a run recorded before that column existed.</p>';
}

function markdown() {
  if (!runs.length) return 'No runs recorded yet. Press Run once, then Record run.';
  const v = verdict(runs);
  const d = runs[runs.length - 1].device;
  const idx = runs[runs.length - 1];
  // The map panel of the last recorded run. Null when js/map.js would not load,
  // and the report then says so rather than printing an empty section.
  const m = idx.raster && idx.raster.ok ? idx.raster : null;
  const outsideTerm = runs.filter((r) => r.gate && !r.gate.open);
  const table = runs.map((r, i) =>
    '| ' + r.state + ' ' + runs.slice(0, i + 1).filter((x) => x.state === r.state).length +
    ' | ' + shownTime(r.at) +
    ' | ' + (r.pointerMs == null ? '-' : round(r.pointerMs)) +
    ' | ' + round(r.netIndex) +
    ' | ' + round(r.parseMedian) +
    ' | ' + round(r.parseFirst) +
    ' | ' + round(r.answerMs) +
    ' | ' + round(r.total) +
    ' | ' + (r.firstInContext ? 'cold' : 'warm') +
    ' | ' + (r.bytes && r.bytes.fromCache ? 'cache hit' : 'network') +
    ' |').join('\n');

  const counts = STATES.map((s) => s + ': ' + runs.filter((r) => r.state === s).length + ' of 5').join(', ');
  const b = idx.bytes;

  return '## ' + new Date().toISOString().slice(0, 10) + '  cold launch on a real phone\n' +
'\n' +
'Measured with `spikes/launch.html`. Network and parse are timed separately with\n' +
'`performance.now()`; each run parses the same string ' + PARSES + ' times and reports the\n' +
'median, because one parse sample on a phone is noise.\n' +
'\n' +
'```\n' +
'Device:            ' + d.ua + '\n' +
'Cores / memory:    ' + (d.cores ?? 'not reported') + ' / ' + (d.memoryGB ? d.memoryGB + ' GB' : 'not reported') + '\n' +
'Screen / DPR:      ' + d.screen + ' / ' + d.dpr + '\n' +
'Standalone:        navigator.standalone ' + d.standalone + ', display-mode ' + d.displayMode + '\n' +
'Connection:        ' + (d.connection || 'not reported by this browser') + '\n' +
'Low Power Mode:    ____  (not readable from the page, fill this in)\n' +
'Index measured:    ' + idx.rooms + ' rooms, ' + idx.buildingsInIndex + ' buildings, ' + idx.tuples + ' busy tuples, ' + idx.sessions + ' sessions\n' +
'Transfer:          ' + (b ? kb(b.encoded) + ' encoded, ' + kb(b.decoded) + ' decoded' + (b.compressed ? ', compressed' : ', not compressed') : 'no Resource Timing entry') + '\n' +
'Runs recorded:     ' + counts + '\n' +
'```\n' +
'\n' +
'**#29 asks for an index of at least 900 rooms and that bar cannot be met.** The\n' +
'one-bucket sample it was written against is gone. This is a full harvest of the\n' +
'term, and the build then deletes rooms on purpose: by type, in a restricted\n' +
'building, off campus, too far from the Oval, too thinly booked, or in a building\n' +
'whose hours nobody publishes. ' + idx.rooms + ' ship, and waiting for 900 is waiting for\n' +
'those filters to be wrong.\n' +
'\n' +
'The bar that can be met is that the file timed is the file `data/current.json`\n' +
'names, and it is: `' + (idx.indexUrl || '../unknown').replace('../', '') + '`, term ' + (idx.indexTerm || 'unrecorded') + '.\n' +
'All of campus is about 1,067 rooms, so an unfiltered index would parse roughly\n' +
(1067 / idx.rooms).toFixed(2) + 'x this. That is arithmetic on two room counts, not a measurement.\n' +
'\n' +
(new Set(runs.map((r) => r.indexTerm)).size > 1
  ? '**These runs span more than one term index, so they are not one measurement.**\n\n'
  : '') +
'| run | at | pointer ms | net ms | parse ms (median of ' + PARSES + ') | first parse ms | answer ms | total ms | JIT | source |\n' +
'|---|---|---|---|---|---|---|---|---|---|\n' +
table + '\n' +
'\n' +
'`total` is network + median parse + first answer. It does not include app boot,\n' +
'module evaluation or geolocation, so it is the fetch-to-answer cost and not the\n' +
'whole cold start.\n' +
'\n' +
'`JIT` is `cold` when the run was the first in its page context and `warm` when the\n' +
'window had already parsed the index once. Only the cold ones describe a launch\n' +
'that actually happens.\n' +
'\n' +
'`pointer ms` is the wait on `data/current.json` before the index could even be\n' +
'asked for. js/app.js boot() awaits the pointer because the pointer is the file\n' +
'that names the index. On a laptop it reads like nothing. On a phone link it is a\n' +
'whole round trip in front of the biggest file the first answer needs.\n' +
(m
  ? '\n' +
    '### map raster\n\n' +
    '```\n' +
    'campus.json network:  ' + round(m.campusMs) + ' ms\n' +
    'buildBasemap:         ' + round(m.buildMs) + ' ms, and ' + round(m.flushMs) + ' ms more to the first readable pixel\n' +
    'Raster:               ' + m.alloc.line + '\n' +
    'Blits into ' + m.viewport + ':  ' + m.blits.join(', ') + ' ms\n' +
    'First blit:           ' + m.blit.line + '\n' +
    'Backing:              ' + m.backing.line + '\n' +
    '```\n\n'
  : '\n' +
    '### map raster\n\n' +
    'js/map.js did not load on this device, so the four map questions in #29 are\n' +
    'unanswered. Every timing number above is unaffected.\n\n') +
'There is no frame counter, on purpose. #29 asks for one; the loop it wanted\n' +
'counted was replaced by the wake-driven one in `js/map.js` `createFrameLoop` in\n' +
'#94, and a settled list asks for 0 frames in 3 seconds at 1x, 4x and 6x CPU\n' +
'throttling on this desk, five runs each, measured with\n' +
'`node scripts/launch-desktop.mjs`. A counter that can only ever print zero\n' +
'teaches a reader that the panel is decoration.\n' +
'\n' +
'**VERDICT: ' + v.line + '**\n' +
'Median cold total: ' + (v.median == null ? '____' : round(v.median) + ' ms over ' + v.n + ' run' + (v.n === 1 ? '' : 's')) +
  (v.first == null ? '' : '. Using the single cold parse instead of the median it is ' + round(v.first) + ' ms') + '.\n' +
'Cold means either state with no warm process behind it, ' + COLD_STATES.join(' or ') + ', pooled.\n' +
'They are printed apart here so the pooling can be checked:\n' +
v.byState.map((b) => '- `' + b.state + '`: ' + b.n + ' run' + (b.n === 1 ? '' : 's') +
  (b.median == null ? ', no median' : ', median ' + round(b.median) + ' ms')).join('\n') + '\n' +
(v.warm ? '\n**Every cold run was recorded in a window that had already parsed the index, so all of them have a warm JIT and this verdict is optimistic.** Reload between runs and record again.\n' : '') +
(outsideTerm.length
  ? '\n**' + outsideTerm.length + ' of these runs ' + (outsideTerm.length === 1 ? 'was' : 'were') + ' recorded outside the term the app answers in (' +
    fmtDay(outsideTerm[0].gate.from) + ' to ' + fmtDay(outsideTerm[0].gate.to) + ').** Fetch and parse cost the same on any date, but the answer step timed work the app would not have done that day.\n'
  : '') +
'\n' +
(baseline
  ? 'Desktop baseline, taken ' + shown(baseline.at) + ' on `' + baseline.device.ua + '`:\n' +
    'network ' + round(baseline.netIndex) + ' ms, parse ' + round(baseline.parseMedian) + ' ms, total ' + round(baseline.total) + ' ms.\n' +
    'Measured phone-over-desktop parse ratio: **' + (median(runs.map((r) => r.parseMedian)) / baseline.parseMedian).toFixed(2) + 'x**' +
    ', against the 4x to 8x #29 assumed.\n'
  : 'No desktop baseline was saved, so the 4x to 8x multiplier in #29 is still untested.\n');
}

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  $('facts').textContent = 'running';
  try {
    last = await once();
    paintFacts(last);
    paintMap(last);
    paintRatio();
    $('record').disabled = false;
    $('baseline').disabled = false;
  } catch (e) {
    $('facts').innerHTML = '<p class="warn">' + String(e) + '</p>';
  }
  $('go').disabled = false;
});

$('record').addEventListener('click', () => {
  if (!last) return;
  last.state = $('state').value;
  runs.push(last);
  store(RUNS_KEY, runs);
  $('record').disabled = true;
  paintRuns();
});

$('baseline').addEventListener('click', () => {
  if (!last) return;
  baseline = last;
  store(BASE_KEY, baseline);
  paintRatio();
});

$('report').addEventListener('click', () => { $('md').value = markdown(); $('sheet').hidden = false; });
$('close').addEventListener('click', () => { $('sheet').hidden = true; });
$('copy').addEventListener('click', async () => {
  $('md').select();
  try { await navigator.clipboard.writeText($('md').value); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Select all and copy'; }
  setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
});
$('wipe').addEventListener('click', () => {
  if (!confirm('Erase all ' + runs.length + ' recorded runs? The desktop baseline is kept.')) return;
  runs = [];
  store(RUNS_KEY, runs);
  paintRuns();
  $('md').value = markdown();
});

paintRuns();
paintRatio();
</script>
</body>
</html>
