<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>walk spike, Vacant #26</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #fff; color: #000;
    padding: max(10px, env(safe-area-inset-top)) 10px max(16px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; text-transform: uppercase; }
  h1 a { color: #444; }
  h2 { font-size: 12px; margin: 6px 0 0; text-transform: uppercase; letter-spacing: .04em; color: #555; }
  p { margin: 0; }
  button {
    font: inherit; min-height: 44px; border: 2px solid #000; background: #fff;
    color: #000; border-radius: 8px; padding: 8px 12px; cursor: pointer; text-align: left;
  }
  button:disabled { opacity: .45; cursor: default; }
  .go { font-size: 19px; font-weight: 700; min-height: 60px; background: #000; color: #fff; text-align: center; }
  select { font: inherit; min-height: 44px; border: 2px solid #000; border-radius: 8px; padding: 0 8px; background: #fff; }
  input[type=text] { font: inherit; min-height: 44px; border: 2px solid #000; border-radius: 8px; padding: 0 8px; width: 100%; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .bar > * { flex: 1; }
  .bar button { font-size: 14px; padding: 6px 8px; min-height: 44px; text-align: center; }
  .card { border: 2px solid #000; border-radius: 8px; padding: 8px 10px; }
  .note { font-size: 12px; color: #555; }
  .warn { color: #a11111; font-weight: 600; }
  .ok { color: #06621f; font-weight: 600; }
  .chip {
    display: inline-block; font-size: 11px; border: 1px solid #666; border-radius: 999px;
    padding: 1px 7px; margin: 2px 3px 0 0; color: #333; white-space: nowrap;
  }
  .chip.hot { border-color: #a11111; color: #a11111; }
  .chip.unk { border-color: #7a4b00; color: #7a4b00; }
  ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .row { border: 2px solid #000; border-radius: 8px; overflow: hidden; }
  .row.done { border-color: #999; }
  .row > .head {
    width: 100%; display: block; border: 0; border-radius: 0; padding: 8px 10px; background: #fff;
  }
  .row.done > .head { background: #f2f2f2; }
  .rname { font-size: 17px; font-weight: 700; display: block; }
  .rid { font-weight: 400; color: #555; font-size: 13px; }
  .rclaim { font-size: 13px; display: block; margin-top: 2px; }
  .rwalk { font-variant-numeric: tabular-nums; }
  .body { padding: 8px 10px; border-top: 2px solid #000; display: flex; flex-direction: column; gap: 6px; }
  .body[hidden] { display: none; }
  .three { display: flex; flex-direction: column; gap: 6px; }
  .three button { text-align: center; font-weight: 700; min-height: 52px; }
  .three .b1 { background: #06621f; color: #fff; border-color: #06621f; }
  .three .b2 { background: #7a4b00; color: #fff; border-color: #7a4b00; }
  .three .b3 { background: #a11111; color: #fff; border-color: #a11111; }
  .small { font-size: 13px; min-height: 44px; }
  .stopwatch { font-variant-numeric: tabular-nums; font-weight: 700; }
  .sheet { position: fixed; inset: 0; background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
  .sheet[hidden] { display: none; }
  textarea { flex: 1; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; border: 2px solid #000; border-radius: 8px; padding: 8px; width: 100%; }
  @media (prefers-reduced-motion: no-preference) { .three button:active { transform: scale(.99); } }
</style>
</head>
<body>

<h1>walk spike <a href="https://github.com/EnesYilmazcode/Vacant/issues/26">#26</a></h1>

<div class="card" id="status">Loading the same three files the app loads.</div>

<div id="setup" hidden>
  <div class="bar">
    <select id="needed" aria-label="How long you would tell the app you need">
      <option value="30" selected>30 min</option>
      <option value="60">1 hour</option>
      <option value="120">2 hours</option>
    </select>
    <button class="go" id="pick">Pick 20 rooms</button>
  </div>
  <p class="note" id="pool"></p>
</div>

<div id="main" hidden>
  <div class="card" id="head"></div>
  <!-- Above the rows, not stuck to the bottom of the viewport. A bar that
       floats over the list covers the button you were reaching for. -->
  <div class="bar">
    <button id="report">Report</button>
    <button id="repick">Re-pick</button>
  </div>
  <ol id="list"></ol>
</div>

<section class="sheet" id="sheet" hidden aria-label="Markdown report">
  <textarea id="md" readonly spellcheck="false"></textarea>
  <div class="bar">
    <button id="copy">Copy</button>
    <button id="close">Close</button>
  </div>
</section>

<script type="module">
import { rank, WALK_MPM, DETOUR } from './engine.vendor.js';
import { pickHoursTerm, makeHoursFor } from './hours.vendor.js';

const $ = (id) => document.getElementById(id);
const KEY = 'vacant.spike.walk.v1';

// js/app.js constants, copied so this page picks exactly what the app shows.
const MAX_WAIT_MIN = 90;
const FIX_TIMEOUT_MS = 8000;
const OVAL = { lat: 39.9995, lon: -83.013 };

// Twenty, split so the walk visits the cases that can break the app rather than
// twenty easy rooms in the nearest building. Quotas are filled in this order,
// scarcest first, and a quota that cannot be filled is reported on the screen
// instead of being quietly topped up from an easier bucket.
const QUOTAS = [
  { key: 'low-confidence', want: 3 },
  { key: 'no-published-hours', want: 6 },
  { key: 'type-1B', want: 3 },
  { key: 'published-hours', want: 8 },
];
const MAX_PER_BUILDING = 2;

const pad = (n) => String(n).padStart(2, '0');
const clock = (m) => {
  const h = Math.floor(m / 60) % 24;
  const ampm = h < 12 ? 'am' : 'pm';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return h12 + ':' + pad(Math.round(m) % 60) + ampm;
};
const dur = (m) => (m >= 60 ? Math.floor(m / 60) + 'h' + pad(m % 60) : m + ' min');
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isoDate = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
// Local, never UTC. Every timestamp in the report is a time somebody was
// standing at a door, and a walk log that reads four hours off is unusable.
const localStamp = (d) => isoDate(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
const shown = (iso) => localStamp(new Date(iso)).replace('T', ' ');

// js/app.js shortName: the Registrar writes "department - building" and the
// half after the dash is the half written on the door.
function shortName(name) {
  const s = String(name ?? '');
  const cut = s.indexOf(' - ');
  return s.length > 24 && cut > 0 ? s.slice(cut + 3) : s;
}

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } };
const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch { alert('This browser will not keep the walk. Finish it in one go, or the rows are lost.'); } };

let data = null;      // the three files, parsed
let walk = load();    // the frozen picks and what has been recorded
let origin = null;    // { lat, lon, source, accuracy }
let engineCheck = 'unchecked';

// ------------------------------------------------------------------ loading

async function boot() {
  const [rooms, buildings, hours, current] = await Promise.all([
    fetch('../data/rooms-1268.json').then((r) => r.json()),
    fetch('../data/buildings-1268.json').then((r) => r.json()),
    fetch('../data/buildings-hours.json').then((r) => r.json()),
    fetch('../data/current.json').then((r) => r.json()),
  ]);
  const term = pickHoursTerm(hours, current);
  data = { rooms, buildings: buildings.buildings, hours, current, term, hoursFor: makeHoursFor(term) };
  checkEngine();

  if (walk) { render(); return; }
  await locate();
}

// This page must not import from js/, so the engine is a byte copy sitting next
// to it. A copy nobody checks is a second definition of "free", so the copy is
// compared against the app's file at load. A failed comparison does not stop
// the page, it just stops the page from claiming the app's definition.
async function checkEngine() {
  try {
    const [mine, theirs] = await Promise.all([
      fetch('./engine.vendor.js').then((r) => r.text()),
      fetch('../js/engine.js').then((r) => r.text()),
    ]);
    engineCheck = mine === theirs ? 'match' : 'DRIFT';
  } catch {
    engineCheck = 'unchecked';
  }
  if (walk) render();
}

// The app's watchdog, because iOS documents its own timeout as unreliable in a
// standalone window. Unlike the app this page does NOT fall back to the Oval on
// its own: a ground-truth walk measured from an origin you were not standing at
// is a wrong measurement, so the fallback needs a finger on it.
function locate() {
  return new Promise((resolve) => {
    $('status').innerHTML = 'Asking for your location. The picks are ranked from wherever you are standing.';
    let settled = false;
    const finish = (o) => { if (settled) return; settled = true; clearTimeout(watch); origin = o; afterLocate(); resolve(); };
    const watch = setTimeout(() => finish(null), FIX_TIMEOUT_MS);
    if (!navigator.geolocation) return finish(null);
    navigator.geolocation.getCurrentPosition(
      (p) => finish({ lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy, source: 'gps' }),
      () => finish(null),
      { enableHighAccuracy: false, timeout: FIX_TIMEOUT_MS, maximumAge: 0 },
    );
  });
}

function afterLocate() {
  if (origin) {
    $('status').innerHTML =
      (origin.source === 'gps'
        ? '<p class="ok">Located to ' + Math.round(origin.accuracy) + ' m.</p>'
        : '<p class="warn">Origin set to the Oval by hand. Every distance below is from the Oval, not from where you are standing.</p>') +
      '<p class="note">' + describeIndex() + '</p>';
    $('setup').hidden = false;
    poolCounts();
    return;
  }
  $('status').innerHTML =
    '<p class="warn">No location.</p>' +
    '<p class="note">The app falls back to the Oval here. For a ground-truth walk that is only right if you are standing on the Oval, so this page will not do it for you.</p>' +
    '<div class="bar" style="margin-top:6px">' +
    '<button id="retry">Try again</button>' +
    '<button id="oval">Pick from the Oval</button></div>';
  $('retry').addEventListener('click', () => locate());
  $('oval').addEventListener('click', () => {
    origin = { ...OVAL, accuracy: null, source: 'oval' };
    afterLocate();
  });
}

function describeIndex() {
  const n = Object.keys(data.rooms.rooms).length;
  return n + ' rooms, ' + data.current.termName + ', schedule read ' + data.current.generated.slice(0, 10) +
    '. Published hours: ' + (data.term ? Object.keys(data.term.buildings).length + ' buildings' : 'none for this term');
}

// ------------------------------------------------------------------ the pool

// Everything the app would show right now, from this origin.
function candidates(needed) {
  const now = new Date();
  const rows = rank(
    Object.entries(data.rooms.rooms).map(([id, r]) => ({ id, ...r })),
    {
      origin, now: now.getHours() * 60 + now.getMinutes(), day: now.getDay(), needed,
      buildings: data.buildings, hoursFor: data.hoursFor,
      sessions: data.rooms.sessions, date: isoDate(now),
    },
  );
  // The same session mask rank() used, so the doubt signals read the index the
  // way the engine just read it.
  const today = isoDate(now);
  const active = data.rooms.sessions.map(([s, e]) => today >= s && today <= e);
  // The app's own list filter, then one more: a room you would have to wait for
  // cannot be falsified by opening its door, so it is not walkable evidence.
  return rows.filter((r) => r.wait <= MAX_WAIT_MIN && r.wait === 0).map((r) => decorate(r, active));
}

// Why this room might be one the app is wrong about. Every signal is read off
// the index or off what rank() returned, never guessed.
function decorate(r, active) {
  const raw = data.rooms.rooms[r.id];
  const doubt = [];
  if (r.malformedBlocks > 0) doubt.push('the engine had to repair ' + r.malformedBlocks + ' booking block(s)');
  if (raw.busy.length === 0) doubt.push('no booking anywhere in the term, so nothing confirms it is in use');
  else if (raw.busy.every((b) => active[b[3]] === false)) doubt.push('every booking belongs to a session that is not running, so it reads free only because of the session mask');
  if (r.seats === null) doubt.push('capacity unknown in the index');
  if (raw.group) doubt.push('a divisible room, booked as halves');
  if (r.hoursKnown && r.usable > 240) doubt.push('claims over four hours');

  const cats = [];
  if (!r.hoursKnown) cats.push('no-published-hours');
  if (raw.type === '1B') cats.push('type-1B');
  if (doubt.length) cats.push('low-confidence');
  if (r.hoursKnown) cats.push('published-hours');

  return { ...r, type: raw.type, group: raw.group === true, n: raw.n, doubt, cats, doubtScore: doubt.length };
}

function poolCounts() {
  const pool = candidates(Number($('needed').value));
  const c = (k) => pool.filter((r) => r.cats.includes(k)).length;
  $('pool').innerHTML =
    pool.length + ' rooms free right now from here, across ' + new Set(pool.map((r) => r.building)).size + ' buildings. ' +
    c('no-published-hours') + ' in buildings with no published hours, ' +
    c('type-1B') + ' type 1B, ' + c('low-confidence') + ' carrying a doubt signal.';
}

// Fill the quotas in order, scarcest bucket first, nearest room first inside a
// bucket, and never more than two rooms in one building.
function pickTwenty(needed) {
  const pool = candidates(needed);
  const taken = new Map();
  const chosen = [];
  const shortfalls = [];

  const take = (r, why) => {
    const used = taken.get(r.building) ?? 0;
    if (used >= MAX_PER_BUILDING) return false;
    taken.set(r.building, used + 1);
    chosen.push({ ...r, picked: why });
    return true;
  };

  for (const q of QUOTAS) {
    const want = q.key === 'published-hours' ? 20 - chosen.length : q.want;
    let got = 0;
    const bucket = pool
      .filter((r) => !chosen.some((c) => c.id === r.id) && r.cats.includes(q.key))
      .sort((a, b) => {
        // Most doubtful first for the doubt bucket. For the general-assignment
        // proxy, a 1B room in a building that DOES publish hours first, because
        // the no-hours quota already covers the other combination and a walk
        // that visits the same case twice learns half as much.
        if (q.key === 'low-confidence') return b.doubtScore - a.doubtScore || a.walk - b.walk;
        if (q.key === 'type-1B') return Number(b.hoursKnown) - Number(a.hoursKnown) || a.walk - b.walk;
        return a.walk - b.walk;
      });
    for (const r of bucket) {
      if (got >= want) break;
      if (take(r, q.key)) got++;
    }
    if (got < want) shortfalls.push('wanted ' + want + ' ' + q.key + ', found ' + got);
  }

  // Only if the quotas together came up short. Still nearest first, still two
  // per building, and the shortfall is recorded in the report either way.
  if (chosen.length < 20) {
    for (const r of [...pool].sort((a, b) => a.walk - b.walk)) {
      if (chosen.length >= 20) break;
      if (chosen.some((c) => c.id === r.id)) continue;
      take(r, 'backfill');
    }
  }

  const now = new Date();
  return {
    version: 1,
    pickedAt: now.toISOString(),
    pickedDate: isoDate(now),
    needed,
    origin,
    term: data.current.term,
    termName: data.current.termName,
    generated: data.current.generated,
    hoursTermSlug: data.term ? data.term.slug : null,
    poolSize: pool.length,
    shortfalls,
    engineCheck,
    rows: chosen.map((r) => ({
      id: r.id, building: r.building, name: r.name, n: r.n, type: r.type,
      metres: r.metres, walk: r.walk, tier: r.tier, hoursKnown: r.hoursKnown,
      usable: r.usable, usableUntil: r.usableUntil, nextClassAt: r.nextClassAt,
      availableAt: r.availableAt, wait: r.wait, seats: r.seats,
      cats: r.cats, picked: r.picked, doubt: r.doubt,
      tapAt: null, visit: null,
    })),
  };
}

// ------------------------------------------------------------------ painting

function label(r) {
  const name = shortName(r.name);
  return name ? (r.n ? name + ' ' + r.n : name) : r.id;
}

function claimText(r) {
  if (!r.hoursKnown) {
    return '<span class="warn">hours not published</span>, so Vacant cannot say when the door locks';
  }
  return 'free for <b>' + dur(r.usable) + '</b>, until ' + clock(r.usableUntil) +
    (r.nextClassAt < 1440 ? ' (next class or close ' + clock(r.nextClassAt) + ')' : '');
}

// A claim made at 18:00 that ran out at 18:40 is not being tested by a door you
// open at 19:15, so the row says so instead of standing there looking true.
function expired(r) {
  const now = new Date();
  if (walk.pickedDate !== isoDate(now)) return true;
  if (!r.hoursKnown) return false; // no published close, so nothing to run out
  return r.usableUntil < now.getHours() * 60 + now.getMinutes();
}

const OUTCOMES = {
  empty: { word: 'open and empty', outer: 'open', inner: 'open', occupied: 'no' },
  occupied: { word: 'open but occupied', outer: 'open', inner: 'open', occupied: 'yes' },
  'locked-outer': { word: 'building door locked', outer: 'locked', inner: '-', occupied: '-' },
  'locked-inner': { word: 'room door locked', outer: 'open', inner: 'locked', occupied: '-' },
  missing: { word: 'no such room', outer: '-', inner: '-', occupied: '-' },
};

function render() {
  if (!walk) return;
  $('setup').hidden = true;
  $('main').hidden = false;
  const done = walk.rows.filter((r) => r.visit).length;
  const staleDay = walk.pickedDate !== isoDate(new Date());

  $('status').innerHTML =
    '<p><b>' + done + ' of 20</b> recorded' + (done === 20 ? '. <span class="ok">Tap Report.</span>' : '.') + '</p>' +
    '<p class="note">Picked ' + shown(walk.pickedAt) + ' from ' +
    (walk.origin.source === 'gps' ? 'a GPS fix good to ' + Math.round(walk.origin.accuracy) + ' m' : 'the Oval, chosen by hand') +
    ', asking for ' + dur(walk.needed) + '. Engine copy: ' +
    (engineCheck === 'match' ? '<span class="ok">matches js/engine.js</span>'
      : engineCheck === 'DRIFT' ? '<span class="warn">DRIFTED from js/engine.js, these picks are not the app\'s picks</span>'
      : 'not checked, js/engine.js was not reachable') + '.</p>' +
    (staleDay ? '<p class="warn">These rows were picked on ' + walk.pickedDate + '. A claim made on another day is not being tested today. Re-pick.</p>' : '') +
    (walk.shortfalls.length ? '<p class="warn">' + walk.shortfalls.join('; ') + '.</p>' : '');

  $('head').innerHTML =
    '<h2>what the twenty are</h2><p class="note">' +
    ['low-confidence', 'no-published-hours', 'type-1B', 'published-hours']
      .map((k) => walk.rows.filter((r) => r.picked === k).length + ' ' + k).join(', ') +
    ', across ' + new Set(walk.rows.map((r) => r.building)).size + ' buildings, from a pool of ' + walk.poolSize + '.</p>';

  $('list').innerHTML = walk.rows.map(rowHtml).join('');
  for (const el of $('list').querySelectorAll('[data-act]')) {
    el.addEventListener('click', (e) => act(e.currentTarget.dataset));
  }
  for (const el of $('list').querySelectorAll('input[data-by]')) {
    el.addEventListener('change', (e) => {
      const r = walk.rows.find((x) => x.id === e.currentTarget.dataset.by);
      if (r && r.visit) { r.visit.by = e.currentTarget.value.trim(); save(walk); }
    });
  }
}

function rowHtml(r, i) {
  const v = r.visit;
  const open = !v && r.tapAt;
  const stale = expired(r);
  const chips = r.cats.map((c) =>
    '<span class="chip ' + (c === 'low-confidence' ? 'hot' : c === 'no-published-hours' ? 'unk' : '') + '">' + c + '</span>').join('') +
    (r.picked === 'backfill' ? '<span class="chip">backfill</span>' : '');

  const head =
    '<button type="button" class="head" data-act="tap" data-id="' + r.id + '" aria-expanded="' + (open ? 'true' : 'false') + '" ' +
    'aria-label="' + esc(label(r) + ', ' + r.walk + ' minute walk, ' + (r.hoursKnown ? 'Vacant says free for ' + dur(r.usable) : 'hours not published') + (v ? ', recorded as ' + OUTCOMES[v.outcome].word : ', not recorded yet')) + '">' +
    '<span class="rname">' + (i + 1) + '. ' + esc(label(r)) + ' <span class="rid">' + r.id + (r.seats ? ' &middot; ' + r.seats + ' seats' : '') + '</span></span>' +
    '<span class="rclaim"><span class="rwalk">' + r.walk + ' min, ' + r.metres + ' m</span> &middot; ' + claimText(r) + '</span>' +
    (stale ? '<span class="rclaim warn">this claim has run out, it no longer tests anything</span>' : '') +
    '<span class="rclaim">' + chips + '</span>' +
    (v ? '<span class="rclaim"><b>' + OUTCOMES[v.outcome].word + '</b>' + (v.minutes > 0 ? ' &middot; walked it in ' + v.minutes + ' min against ' + r.walk + ' predicted' : '') + (v.by ? ' &middot; ' + esc(v.by) : '') + '</span>' : '') +
    '</button>';

  const body = v
    ? '<div class="body"><div class="bar">' +
      (v.outcome === 'occupied' ? '<input type="text" data-by="' + r.id + '" value="' + esc(v.by || '') + '" placeholder="occupied by what?" aria-label="What was in the room">' : '') +
      '<button class="small" data-act="undo" data-id="' + r.id + '">Undo</button></div></div>'
    : '<div class="body"' + (open ? '' : ' hidden') + '>' +
      (r.doubt.length ? '<p class="note">' + r.doubt.map(esc).join('. ') + '.</p>' : '') +
      '<p class="note">Walk started <span class="stopwatch" data-since="' + (r.tapAt || '') + '">' + since(r.tapAt) + '</span> ago. Record when you touch the room\'s own door.</p>' +
      '<div class="three">' +
      '<button class="b1" data-act="empty" data-id="' + r.id + '">Open and empty</button>' +
      '<button class="b2" data-act="occupied" data-id="' + r.id + '">Open but occupied</button>' +
      '<button class="b3" data-act="locked" data-id="' + r.id + '">Locked</button>' +
      '</div>' +
      '<div data-locked="' + r.id + '" hidden>' +
      '<p class="note"><b>Which door?</b> The row is not recorded until this is answered.</p>' +
      '<div class="bar" style="margin-top:4px">' +
      '<button class="small" data-act="locked-outer" data-id="' + r.id + '">Building door</button>' +
      '<button class="small" data-act="locked-inner" data-id="' + r.id + '">Room door</button>' +
      '</div></div>' +
      '<div class="bar"><button class="small" data-act="missing" data-id="' + r.id + '">No such room</button>' +
      '<button class="small" data-act="cancel" data-id="' + r.id + '">Not now</button></div>' +
      '</div>';

  return '<li class="row' + (v ? ' done' : '') + '" value="' + (i + 1) + '">' + head + body + '</li>';
}

function since(iso) {
  if (!iso) return '0:00';
  const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000));
  return Math.floor(s / 60) + ':' + pad(s % 60);
}

function act({ act: what, id }) {
  const r = walk.rows.find((x) => x.id === id);
  if (!r) return;
  if (what === 'tap') {
    if (r.visit) { r.visit = null; save(walk); render(); return; }
    // Tapping starts the stopwatch #26 wants run from the row to the door.
    if (!r.tapAt) r.tapAt = new Date().toISOString();
    else r.tapAt = null;
    save(walk); render(); return;
  }
  if (what === 'cancel') { r.tapAt = null; save(walk); render(); return; }
  if (what === 'undo') { r.visit = null; r.tapAt = null; save(walk); render(); return; }
  if (what === 'locked') {
    // Refuse to guess which door. The five error buckets #26 asks for only sum
    // to twenty if locked-building and locked-room stay separate.
    const el = $('list').querySelector('[data-locked="' + id + '"]');
    if (el) el.hidden = false;
    return;
  }
  const at = new Date();
  r.visit = {
    outcome: what,
    at: at.toISOString(),
    minutes: r.tapAt ? Math.round(((at - Date.parse(r.tapAt)) / 60000) * 10) / 10 : null,
    by: '',
  };
  save(walk);
  render();
}

// The stopwatch on an open row, once a second, only while a row is open.
setInterval(() => {
  for (const el of document.querySelectorAll('.stopwatch[data-since]')) {
    if (el.dataset.since) el.textContent = since(el.dataset.since);
  }
}, 1000);

// ------------------------------------------------------------------ report

function markdown() {
  const rows = walk.rows;
  const visited = rows.filter((r) => r.visit);
  const bucket = {
    correct: visited.filter((r) => r.visit.outcome === 'empty').length,
    occupied: visited.filter((r) => r.visit.outcome === 'occupied').length,
    lockedBuilding: visited.filter((r) => r.visit.outcome === 'locked-outer').length,
    lockedRoom: visited.filter((r) => r.visit.outcome === 'locked-inner').length,
    missing: visited.filter((r) => r.visit.outcome === 'missing').length,
  };
  const wrong = bucket.occupied + bucket.lockedBuilding + bucket.lockedRoom + bucket.missing;
  const missingBy = visited.filter((r) => r.visit.outcome === 'occupied' && !r.visit.by).length;

  const table = rows.map((r) => {
    const v = r.visit;
    const o = v ? OUTCOMES[v.outcome] : null;
    return '| ' + r.id +
      ' | ' + (v ? localStamp(new Date(v.at)) : 'not visited') +
      ' | ' + (r.hoursKnown ? dur(r.usable) : 'not published') +
      ' | ' + r.walk + ' min' +
      ' | ' + (r.hoursKnown ? 'bounded' : 'open-ended') + '(' + r.tier + ')' +
      ' | ' + (o ? o.outer : '-') +
      ' | ' + (o ? o.inner : '-') +
      ' | ' + (o ? o.occupied : '-') +
      ' | ' + (v && v.by ? v.by : '-') +
      ' | ' + r.picked +
      ' | ' + r.metres +
      // A door-to-door time only counts once a minute has actually gone by. A
      // row recorded the instant it was opened is not a timed walk.
      ' | ' + (v && v.minutes > 0 ? v.minutes : '-') +
      ' |';
  }).join('\n');

  // Solve back for the fudge factors in js/engine.js from the rows that carry a
  // stopwatch time. DETOUR is held at its shipped value and WALK_MPM moves,
  // because only one of the two can be fitted from door-to-door times.
  const timed = visited.filter((r) => r.visit.minutes > 0);
  const sumM = timed.reduce((a, r) => a + r.metres, 0);
  const sumT = timed.reduce((a, r) => a + r.visit.minutes, 0);
  const fittedMpm = sumT > 0 ? sumM * DETOUR / sumT : null;
  const straightMpm = sumT > 0 ? sumM / sumT : null;

  const byCat = (key) => {
    const set = rows.filter((r) => r.picked === key && r.visit);
    const right = set.filter((r) => r.visit.outcome === 'empty').length;
    return set.length ? right + ' of ' + set.length + ' correct' : 'none visited';
  };

  const buildings = new Set(rows.map((r) => r.building)).size;
  const offHours = visited.filter((r) => {
    const d = new Date(r.visit.at);
    return d.getDay() === 0 || d.getDay() === 6 || d.getHours() >= 19;
  }).length;
  const noHoursRows = rows.filter((r) => !r.hoursKnown).length;
  const t1b = rows.filter((r) => r.type === '1B').length;

  const check = (ok, text) => '- [' + (ok ? 'x' : ' ') + '] ' + text;

  return '## Ground-truth walk, ' + walk.pickedDate + '\n' +
'\n' +
'Picked with `spikes/walk.html`, which ranks with a byte copy of `js/engine.js`\n' +
'(' + (walk.engineCheck === 'match' ? 'verified identical at pick time' : walk.engineCheck === 'DRIFT' ? '**DRIFTED at pick time, these are not the app\'s picks**' : 'not verified at pick time') + ')\n' +
'and the hours lookup copied from `js/app.js`. Twenty rooms the app called free\n' +
'from ' + (walk.origin.source === 'gps' ? 'a GPS fix good to ' + Math.round(walk.origin.accuracy) + ' m' : 'the Oval, chosen by hand') +
' at ' + shown(walk.pickedAt) + ', asking for ' + dur(walk.needed) + '.\n' +
'Index: ' + walk.termName + ', schedule read ' + walk.generated.slice(0, 10) + '. Pool it was drawn from: ' + walk.poolSize + ' rooms.\n' +
'Only rooms free **on arrival** were eligible, because a room you would have to\n' +
'wait for cannot be checked by opening its door.\n' +
(walk.shortfalls.length ? '\nQuota shortfalls at pick time: ' + walk.shortfalls.join('; ') + '.\n' : '') +
'\n' +
'### Error rate\n' +
'\n' +
'```\n' +
'correct (open and empty)                 ' + bucket.correct + ' / 20\n' +
'occupied by something unscheduled        ' + bucket.occupied + ' / 20\n' +
'locked building                          ' + bucket.lockedBuilding + ' / 20\n' +
'locked room                              ' + bucket.lockedRoom + ' / 20\n' +
'room does not exist                      ' + bucket.missing + ' / 20\n' +
'                                         ' + '-'.repeat(8) + '\n' +
'recorded                                 ' + visited.length + ' / 20\n' +
'wrong                                    ' + wrong + ' / 20' + (visited.length ? '  (' + Math.round((wrong / visited.length) * 100) + '% of what was visited)' : '') + '\n' +
'```\n' +
'\n' +
'Split by why the room was picked, which is the split that changes the product:\n' +
'\n' +
'- rooms in buildings with **published** hours: ' + byCat('published-hours') + '\n' +
'- rooms in buildings with **no published** hours: ' + byCat('no-published-hours') + '\n' +
'- **type 1B** rooms, the general-assignment proxy: ' + byCat('type-1B') + '\n' +
'- rooms carrying a **doubt signal**: ' + byCat('low-confidence') + '\n' +
'\n' +
'What the doubt signals were, so the split above can be read:\n' +
'\n' +
rows.filter((r) => r.doubt.length).map((r) =>
  '- `' + r.id + '` ' + r.doubt.join('; ') + (r.visit ? ' -> ' + OUTCOMES[r.visit.outcome].word : ' -> not visited')).join('\n') + '\n' +
(missingBy ? '\n' + missingBy + ' occupied row' + (missingBy === 1 ? '' : 's') + ' carry no `by`, so what was in the room was not written down.\n' : '') +
'\n' +
'### Rows\n' +
'\n' +
'| room | ts | app_usable | app_walk | tier | outer | inner | occupied | by | picked as | metres | actual min |\n' +
'|---|---|---|---|---|---|---|---|---|---|---|---|\n' +
table + '\n' +
'\n' +
'### Walking speed\n' +
'\n' +
(fittedMpm == null
  ? 'No door-to-door times recorded, so `WALK_MPM` and `DETOUR` stay where they are.\n'
  : timed.length + ' row' + (timed.length === 1 ? '' : 's') + ' carry a stopwatch time: ' + sumM + ' m of straight-line distance in ' +
    Math.round(sumT * 10) / 10 + ' min.\n' +
    'Holding `DETOUR` at ' + DETOUR + ', the fitted `WALK_MPM` is **' + Math.round(fittedMpm) + '** against the shipped ' + WALK_MPM + '.\n' +
    'Straight-line metres per minute, with no detour factor at all, is ' + Math.round(straightMpm) + '.\n' +
    (timed.length < 8 ? '\n#26 asks for 8 or more stopwatch rows and this has ' + timed.length + ', so the fit is thin.\n' : '')) +
'\n' +
'### Against the #26 checklist\n' +
'\n' +
check(visited.length === 20, '20 visit rows (' + visited.length + ')') + '\n' +
check(buildings >= 6, buildings + ' buildings, 6 or more wanted') + '\n' +
check(offHours >= 4, offHours + ' rows on a Saturday, Sunday or after 19:00, 4 or more wanted') + '\n' +
check(t1b >= 3, t1b + ' type 1B rooms, 3 or more wanted') + '\n' +
check(noHoursRows >= 2, noHoursRows + ' rows in buildings with no row in buildings-hours.json, 2 or more wanted') + '\n' +
check(timed.length >= 8, timed.length + ' rows with a door-to-door time, 8 or more wanted') + '\n' +
check(visited.length === 20, 'the five buckets sum to 20') + '\n' +
'\n' +
'Not covered by this page, still open on #26: the Roomix cross-check\n' +
'(`room_matrix.json` and `courses.json`), the interval diff in both directions,\n' +
'and the list of rooms Roomix has that our index never saw. Those need no walking\n' +
'and can be run from a laptop.\n' +
'\n' +
'The `ga: false` flag from #9 is not in `rooms-1268.json` yet, so "general\n' +
'assignment" above is a proxy: `type == "1B"`, the 424 rooms #9 calls out as the\n' +
'ones the two filters disagree about. When the flag ships, re-read this split.\n';
}

// ------------------------------------------------------------------ wiring

$('pick').addEventListener('click', () => {
  walk = pickTwenty(Number($('needed').value));
  save(walk);
  render();
});
$('needed').addEventListener('change', poolCounts);
$('repick').addEventListener('click', async () => {
  const done = walk.rows.filter((r) => r.visit).length;
  if (done && !confirm('Throw away ' + done + ' recorded visit' + (done === 1 ? '' : 's') + ' and pick twenty again?')) return;
  walk = null;
  localStorage.removeItem(KEY);
  $('main').hidden = true;
  await locate();
});
$('report').addEventListener('click', () => { $('md').value = markdown(); $('sheet').hidden = false; });
$('close').addEventListener('click', () => { $('sheet').hidden = true; });
$('copy').addEventListener('click', async () => {
  $('md').select();
  try { await navigator.clipboard.writeText($('md').value); $('copy').textContent = 'Copied'; }
  catch { $('copy').textContent = 'Select all and copy'; }
  setTimeout(() => { $('copy').textContent = 'Copy'; }, 1500);
});

boot().catch((e) => {
  $('status').innerHTML = '<p class="warn">Could not load the data files: ' + esc(String(e)) + '</p>';
});
</script>
</body>
</html>
